<form [formGroup]="form">
  <div class="grid">
    <div class="col-12 lg:col-4">
      <p-inputGroup>
        <p-inputGroupAddon>Tipo</p-inputGroupAddon>
        <p-dropdown
          formControlName="selectedTable"
          [options]="options"
          optionLabel="label"
          placeholder="Selecciona un tipo de acceso"
          styleClass="group-element"
          [style]="{ flex: 1, width: '100%' }"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Desde</p-inputGroupAddon>
        <p-calendar
          formControlName="filtroDesde"
          [showIcon]="true"
          inputStyleClass="group-element"
          appendTo="body"
          [style]="{ flex: '1', width: '100%' }"
        ></p-calendar>
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Hasta</p-inputGroupAddon>
        <p-calendar
          formControlName="filtroHasta"
          [showIcon]="true"
          inputStyleClass="group-element"
          appendTo="body"
          [style]="{ flex: '1', width: '100%' }"
        ></p-calendar>
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-2">
      <p-button
        label="Exportar"
        icon="pi pi-download"
        severity="secondary"
        (click)="generarExcel()"
        class="w-full"
      />
    </div>
  </div>
</form>

<app-table-primeng
  [columnas]="columns"
  [data]="data"
  [scrollable]="true"
  scrollHeight="flex"
  [showCaption]="false"
  [showPaginator]="true"
  selectionMode="single"
  [sortField]="'dtFecha'"
  (selectedRowDataChange)="selectRow($event)"
>
</app-table-primeng>

<p-dialog
  [header]="'Detalle de auditoría'"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '85vw', '640px': '100vw' }"
  [style]="{
    width: '75vw',
    maxWidth: '100vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  (onHide)="cerrarDialogo()"
  [resizable]="true"
  [maximizable]="true"
>
  <ng-content>
    <div class="flex justify-content-between mb-3">
      <span>Esquema: {{ selectRowData?.cAudEsquema }}</span>
      <span>Fecha: {{ selectRowData?.dtFecha }}</span>
    </div>
    <div class="flex justify-content-between mb-3">
      <span>
        Usuario:
        {{ selectRowData?.cAudUsuario ?? selectRowData?.cCredUsuario }}
      </span>
    </div>
    <div class="mb-3">
      <p-accordion>
        <p-accordionTab header="Operación realizada">
          <p class="flex flex-wrap" [textContent]="selectRowData?.cAudOperacion"></p>
        </p-accordionTab>
      </p-accordion>
    </div>
    <div>
      <app-table-primeng
        [columnas]="columnsDetail"
        [data]="selectRowData?.cAudDatos"
        [scrollable]="true"
        [caption]="selectRowData?.cAudTabla"
        scrollHeight="flex"
        [showCaption]="true"
        [showPaginator]="true"
      >
      </app-table-primeng>
    </div>
  </ng-content>
</p-dialog>
