<p-dialog
  [(visible)]="visible"
  [focusOnShow]="false"
  [style]="{ width: '75vw' }"
  [breakpoints]="{ '960px': '100vw', '640px': '100vw' }"
  [modal]="true"
  styleClass="p-fluid roles-dialog"
  [draggable]="false"
  (onHide)="cerrarDialog()"
>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Cambiar fecha de caducidad</div>
      <div class="flex">{{ usuario?.cApellidosNombres }}</div>
    </div>
  </ng-template>

  <form [formGroup]="formCambiarFecha">
    <div class="grid p-fluid mt-2">
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon> Fecha actual </p-inputGroupAddon>
          <p-calendar
            formControlName="fechaActual"
            dateFormat="dd/mm/yy"
            [showTime]="true"
            [hourFormat]="'24'"
            variant="filled"
            appendTo="body"
            [showOnFocus]="false"
            styleClass="dropdown-field"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon> Nueva fecha </p-inputGroupAddon>
          <p-calendar
            formControlName="nuevaFecha"
            dateFormat="dd/mm/yy"
            [showTime]="true"
            [hourFormat]="'24'"
            variant="filled"
            appendTo="body"
            styleClass="dropdown-field"
          />
        </p-inputGroup>
      </div>
    </div>
    <div class="flex justify-content-end mt-2">
      <p-button label="Actualizar" severity="warning" (click)="actualizarFecha()" />
    </div>
  </form>
</p-dialog>
