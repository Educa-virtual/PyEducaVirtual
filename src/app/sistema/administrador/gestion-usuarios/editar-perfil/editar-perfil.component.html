<p-dialog
  [(visible)]="visible"
  [style]="{ width: '75vw' }"
  [breakpoints]="{ '960px': '100vw', '640px': '100vw' }"
  [modal]="true"
  styleClass="p-fluid"
  [draggable]="false"
  (onHide)="cerrarDialog()"
>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Registro de perfiles</div>
      <div class="flex">{{ usuario?.cApellidosNombres }}</div>
    </div>
  </ng-template>

  <form [formGroup]="formAgregarPerfil">
    <div class="grid p-fluid mt-2">
      <div class="col-12 md:col">
        <p-inputGroup>
          <p-inputGroupAddon> Perfil </p-inputGroupAddon>
          <p-dropdown
            [options]="perfiles"
            formControlName="iPerfilId"
            [filter]="true"
            [showClear]="true"
            appendTo="body"
            placeholder="Seleccione"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-4" *ngIf="buscarUgel">
        <p-inputGroup>
          <p-inputGroupAddon> UGEL </p-inputGroupAddon>
          <p-dropdown
            [options]="ugeles"
            formControlName="iUgelId"
            [filter]="true"
            [showClear]="true"
            appendTo="body"
            placeholder="Seleccione"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6" *ngIf="buscarIe">
        <p-inputGroup>
          <p-inputGroupAddon> Nivel </p-inputGroupAddon>
          <p-dropdown
            [options]="nivel_tipos"
            formControlName="iNivelTipoId"
            [filter]="true"
            [showClear]="true"
            appendTo="body"
            placeholder="Seleccione"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6" *ngIf="buscarIe">
        <p-inputGroup>
          <p-inputGroupAddon> I.E. </p-inputGroupAddon>
          <p-dropdown
            [options]="instituciones_educativas"
            formControlName="iIieeId"
            [filter]="true"
            [showClear]="true"
            appendTo="body"
            placeholder="Seleccione"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-4" *ngIf="buscarIe">
        <p-inputGroup>
          <p-inputGroupAddon> Sede </p-inputGroupAddon>
          <p-dropdown
            [options]="sedes"
            formControlName="iSedeId"
            [filter]="true"
            [showClear]="true"
            appendTo="body"
            placeholder="Seleccione"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-2">
        <p-button
          label="Agregar"
          severity="success"
          [disabled]="formAgregarPerfil.invalid"
          (click)="agregarPerfil()"
        />
      </div>
    </div>
  </form>

  <div class="mt-4">
    <p-table
      [value]="dataPerfilesUsuario"
      [paginator]="true"
      [rows]="20"
      [showCurrentPageReport]="true"
      styleClass="p-datatable-sm"
      sortField="dtCredEntPerfCreado"
      [sortOrder]="-1"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 5%" class="text-center">#</th>
          <th style="width: 20%" pSortableColumn="cPerfilNombre">
            <div class="flex flex-nowrap">
              <span>Perfil</span>
              <p-sortIcon field="cPerfilNombre"></p-sortIcon>
            </div>
          </th>
          <th style="width: 20%" pSortableColumn="cNivelTipoNombre">
            <div class="flex flex-nowrap">
              <span>Nivel</span>
              <p-sortIcon field="cNivelTipoNombre"></p-sortIcon>
            </div>
          </th>
          <th style="width: 35%" pSortableColumn="cInstitucionNombre">
            <div class="flex flex-nowrap">
              <span>Institución</span>
              <p-sortIcon field="cInstitucionNombre"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="cCredEntPerfEstadoNombre">
            <div class="flex flex-nowrap justify-content-center">
              <span>Estado</span>
              <p-sortIcon field="cCredEntPerfEstadoNombre"></p-sortIcon>
            </div>
          </th>
          <th style="width: 15%" pSortableColumn="dtCredEntPerfCreado">
            <div class="flex flex-nowrap justify-content-center">
              <span>Creado</span>
              <p-sortIcon field="dtCredEntPerfCreado"></p-sortIcon>
            </div>
          </th>
          <th style="width: 5%" class="text-center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-perfil let-i="rowIndex">
        <tr
          [ngClass]="{
            'bg-gray-100': i % 2 === 0,
          }"
        >
          <td class="text-center">
            {{ i + 1 }}
          </td>
          <td>{{ perfil.cPerfilNombre }}</td>
          <td>{{ perfil.cNivelTipoNombre }}</td>
          <td>{{ perfil.cInstitucionNombre }}</td>
          <td class="text-center">
            <p-tag
              [severity]="+perfil.iCredEntPerfEstado === 1 ? 'success' : 'danger'"
              [value]="perfil.cCredEntPerfEstadoNombre"
            />
          </td>

          <td class="text-center">
            {{ perfil.dtCredEntPerfCreado | date: 'dd/MM/y' }}
          </td>
          <td class="text-center">
            <button
              *ngIf="+perfil.iCredEntPerfEstado === 0"
              [rounded]="true"
              pButton
              pRipple
              pTooltip="Activar"
              tooltipPosition="left"
              (click)="preguntarActivarPerfil(perfil)"
              class="p-1"
              ngClass="p-button-rounded p-button-sm p-button-success p-button-text p-button-icon-only"
            >
              <i class="pi pi-check"></i>
            </button>
            <button
              *ngIf="+perfil.iCredEntPerfEstado === 1"
              [rounded]="true"
              pButton
              pRipple
              pTooltip="Desactivar"
              tooltipPosition="left"
              (click)="preguntarDesactivarPerfil(perfil)"
              class="p-1"
              ngClass="p-button-rounded p-button-sm p-button-danger p-button-text p-button-icon-only"
            >
              <i class="pi pi-times"></i>
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-dialog>
