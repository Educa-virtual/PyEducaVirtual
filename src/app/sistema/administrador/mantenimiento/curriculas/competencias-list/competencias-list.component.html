<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Competencias de: {{ caption }}</div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons" class="flex flex-column flex-1">
    <div class="flex flex-wrap gap-2 justify-content-end">
      <p-button size="small" severity="secondary" (click)="salir()">
        <i class="pi pi-arrow-left"></i>
        <span class="ml-2 hidden sm:block">Regresar</span>
      </p-button>
      <p-button
        size="small"
        pTooltip="Agregar competencia"
        tooltipPosition="top"
        (click)="accionBtnItem({ accion: 'agregar' })"
        severity="success"
      >
        <i class="pi pi-plus"></i>
        <span class="ml-2 hidden sm:block">Agregar</span>
      </p-button>
    </div>
  </ng-template>

  <app-table-primeng
    [columnas]="competenciasColumns"
    [actions]="accionesTablacompetencias"
    [data]="competencias"
    (accionBtnItem)="accionBtnItem($event)"
    [searchPlaceholder]="'Buscar por nombre...'"
  >
  </app-table-primeng>
</p-panel>

<p-dialog
  [(visible)]="visible_competencia"
  [modal]="true"
  [maximizable]="false"
  appendTo="body"
  [style]="{ width: '50rem' }"
>
  <ng-template pTemplate="header">
    <div class="inline-flex align-items-center justify-content-center gap-2">
      <span class="font-bold white-space-nowrap">{{ titulo }}</span>
    </div>
  </ng-template>

  <form [formGroup]="formCompetencia">
    <div class="col-12 grid">
      <div class="field col-12 md:col-6">
        <span class="p-float-label w-full">
          <input
            pInputText
            id="cCompetenciaNro"
            formControlName="cCompetenciaNro"
            class="w-full"
            placeholder="Nro. de competencia"
          />
          <label for="cCompetenciaNro">Número</label>
        </span>
      </div>
      <div class="field col-12 md:col-6">
        <span class="p-float-label w-full">
          <input
            pInputText
            id="cCompetenciaNombre"
            formControlName="cCompetenciaNombre"
            class="w-full"
            maxlength="200"
          />
          @if (
            formCompetencia.get('cCompetenciaNombre').dirty &&
            formCompetencia.get('cCompetenciaNombre').invalid &&
            formCompetencia.get('cCompetenciaNombre').touched
          ) {
            <small class="text-red-500"> Este campo es obligatorio. </small>
          }
          <label for="cCompetenciaNombre">Nombre de la competencia (*)</label>
        </span>
      </div>
    </div>
    <div class="col-12 grid">
      <div class="field col-12">
        <span class="p-float-label w-full">
          <textarea
            pInputTextarea
            id="cCompetenciaDescripcion"
            formControlName="cCompetenciaDescripcion"
            class="w-full"
            rows="3"
          >
          </textarea>
          <label for="cCompetenciaDescripcion">Descripción</label>
        </span>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="grid">
      <div class="col-12 justify-content-between">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times-circle"
          severity="danger"
          class="p-button-rounded p-button-text"
          (onClick)="visible_competencia = false"
        />
        <p-button
          *ngIf="bUpdate"
          type="button"
          icon="pi pi-save"
          label="Actualizar"
          class="p-button-rounded p-button-text"
          (click)="accionBtnItem({ accion: 'actualizar_competencia' })"
          severity="warning"
          [disabled]="formCompetencia.invalid"
        />
        <p-button
          *ngIf="!bUpdate"
          type="button"
          icon="pi pi-save"
          label="Guardar"
          class="p-button-rounded p-button-text"
          (click)="accionBtnItem({ accion: 'agregar_competencia' })"
          severity="primary"
          [disabled]="formCompetencia.invalid"
        />
      </div>
    </div>
  </ng-template>
</p-dialog>

<p-toast />
