<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">
        Competencias de: {{ curricula.cCurrDescripcion ?? '' }}
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons" class="flex flex-column flex-1">
    <div class="flex flex-wrap gap-2 justify-content-end">
      <p-button
        size="small"
        pTooltip="Agregar"
        tooltipPosition="top"
        (click)="accionBtnItem({ accion: 'agregar' })"
        severity="success"
      >
        <i class="pi pi-plus"></i>
        <span class="ml-2 hidden sm:block">Agregar</span>
      </p-button>
      <p-button
        size="small"
        pTooltip="Regresar"
        tooltipPosition="top"
        (click)="accionBtnItem({ accion: 'regresar' })"
        severity="secondary"
      >
        <i class="pi pi-arrow-left"></i>
        <span class="ml-2 hidden sm:block">Regresar</span>
      </p-button>
    </div>
  </ng-template>

  <div class="grid">
    <div class="col-12 mt-3">
      @if (competencias.length > 0) {
        <app-table-primeng
          class="w-full"
          [columnas]="competenciasColumns"
          [data]="competencias"
          [actions]="accionesTablacompetencias"
          (accionBtnItem)="accionBtnItem($event)"
          [searchPlaceholder]="'Buscar por competencia...'"
        />
      } @else {
        <app-no-data [showIcon]="'NO-DATA'" mensaje="No se encontraron competencias asignadas" />
      }
    </div>
  </div>
</p-panel>

<!-- DIALOG 1: DATOS DE LA COMPETENCIA -->
<p-dialog
  header="{{ titulo }}"
  [(visible)]="visible_competencia"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    height: '80vh',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  [resizable]="true"
  [maximizable]="true"
>
  <ng-template pTemplate="content">
    <p-messages severity="info" [closable]="true">
      <ng-template pTemplate="content">
        <p>Los parámetros en (*) son obligatorios</p>
      </ng-template>
    </p-messages>
    <form [formGroup]="formCompetencia" class="flex flex-column gap-3 w-full">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>N°</p-inputGroupAddon>
            <p-inputNumber
              inputId="cCompetenciaNro"
              [min]="1"
              formControlName="cCompetenciaNro"
              inputStyleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
              [showButtons]="true"
            ></p-inputNumber>
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Estado (*)</p-inputGroupAddon>
            <p-dropdown
              [options]="estados_competencias"
              formControlName="iEstado"
              [showClear]="true"
              appendTo="body"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup>
            <p-inputGroupAddon>Nombre (*)</p-inputGroupAddon>
            <input
              pInputText
              id="cCompetenciaNombre"
              class="group-element"
              formControlName="cCompetenciaNombre"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Descripción</p-inputGroupAddon>
            <textarea
              pInputTextarea
              id="cCompetenciaDescripcion"
              class="group-element"
              formControlName="cCompetenciaDescripcion"
              rows="5"
              [style]="{ flex: '1', width: '100%', resize: 'none' }"
            ></textarea>
          </p-inputGroup>
        </div>
      </div>
    </form>
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        (click)="visible_competencia = false"
      />
      <p-button
        label="Editar"
        icon="pi pi-pencil"
        severity="warning"
        [disabled]="formCompetencia.invalid"
        (click)="accionBtnItem({ accion: 'actualizar_competencia', item: formCompetencia.value })"
        *ngIf="bUpdate"
      />
      <p-button
        label="Guardar"
        icon="pi pi-save"
        severity="success"
        size="small"
        (click)="accionBtnItem({ accion: 'agregar_competencia', item: formCompetencia.value })"
        *ngIf="!bUpdate"
        [disabled]="formCompetencia.invalid"
      />
    </div>
  </ng-template>
</p-dialog>

<!-- DIALOG 2: CAPACIDADES DE LA COMPETENCIA -->
<p-dialog
  header="Capacidades de la competencia: {{ competenciaSeleccionada?.cCompetenciaNombre ?? '' }}"
  [(visible)]="visible_capacidades"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    height: '80vh',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  [resizable]="true"
  [maximizable]="true"
>
  <ng-template pTemplate="content">
    <div *ngIf="iCompetenciaIdSeleccionada > 0">
      <app-curricula-competencia-capacidades
        [iCompetenciaId]="iCompetenciaIdSeleccionada"
      ></app-curricula-competencia-capacidades>
    </div>
    <div *ngIf="iCompetenciaIdSeleccionada === 0">
      <app-no-data [showIcon]="'NO-DATA'" mensaje="No se encontraron capacidades asignadas" />
    </div>
  </ng-template>
</p-dialog>
<p-toast />
