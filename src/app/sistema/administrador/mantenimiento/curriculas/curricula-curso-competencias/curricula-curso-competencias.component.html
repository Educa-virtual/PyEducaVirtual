<app-container-page
  title="Lista de competencias"
  [actions]="actionsContainer"
  (accionBtnItem)="accionBtnItem($event)"
>
  <div class="grid">
    <div class="col-12 md:col-4">
      <form [formGroup]="frmCursosCompetencias" class="flex flex-column gap-3 w-full">
        <div class="col-12" Class="w-full">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Modalidad (*)</p-inputGroupAddon>
            <p-dropdown
              [options]="modalidad"
              [showClear]="true"
              formControlName="iNivelId"
              optionValue="iNivelId"
              placeholder="Seleccione una modalidad"
              styleClass="group-element"
              (onChange)="accionBtnItem({ accion: 'select_modalidad', item: [] })"
              optionLabel="cNivelNombre"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12" Class="w-full" *ngIf="this.frmCursosCompetencias.value.iNivelId > 0">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Nivel (*)</p-inputGroupAddon>
            <p-dropdown
              [options]="nivel_tipo_actual"
              [showClear]="true"
              formControlName="iNivelTipoId"
              optionValue="iNivelTipoId"
              placeholder="Seleccione un nivel"
              styleClass="group-element"
              optionLabel="cNivelTipoNombre"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Competencia (*)</p-inputGroupAddon>
            <p-dropdown
              [options]="competencias"
              [showClear]="true"
              formControlName="iCompetenciaId"
              optionLabel="competencia"
              optionValue="iCompetenciaId"
              placeholder="Seleccione una competencia"
              styleClass="group-element"
              filter="true"
              appendTo="self"
              [style]="{ flex: '1', width: '100%' }"
            >
            </p-dropdown>
          </p-inputGroup>
        </div>
        <div class="col-12">
          <div class="grid">
            <div class="col-6 flex align-items-center">
              <label for="iEstado" class="mr-2">Estado:</label>
              <p-inputSwitch formControlName="iEstado" [trueValue]="1" [falseValue]="0" />
            </div>
            <div class="col-6 flex justify-content-end">
              <button
                pButton
                label="Guardar"
                *ngIf="!bUpdate"
                icon="pi pi-save"
                class="p-button-success"
                size="small"
                (click)="accionBtnItem({ accion: 'guardar', item: frmCursosCompetencias.value })"
                [disabled]="frmCursosCompetencias.invalid"
              ></button>

              <button
                pButton
                label="Actualizar"
                *ngIf="bUpdate"
                icon="pi pi-pencil"
                class="p-button-warning"
                size="small"
                [disabled]="frmCursosCompetencias.invalid"
                (click)="accionBtnItem({ accion: 'actualizar', item: frmCursosCompetencias.value })"
              ></button>
            </div>
          </div>
        </div>
      </form>
      <div class="tag2">Los parámetros en (*) son obligatorios</div>
    </div>
    <div class="col-12 md:col-8" *ngIf="!modoFormulario">
      <div class="grid">
        <div class="col-12 mt-3">
          @if (competencias_area.length > 0) {
            <app-table-primeng
              class="w-full"
              [columnas]="columns"
              [data]="competencias_area"
              [actions]="actions"
              (accionBtnItem)="accionBtnItem($event)"
              [showAdvancedFilter]="true"
              [showCaption]="false"
            />
          } @else {
            <app-no-data
              [showIcon]="'NO-DATA'"
              mensaje="No se encontraron competencias asignadas"
            />
          }
        </div>
      </div>
    </div>
  </div>
</app-container-page>
