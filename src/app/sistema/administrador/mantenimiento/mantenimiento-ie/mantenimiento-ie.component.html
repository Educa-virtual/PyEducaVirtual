<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />
<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column gap-2">
      <div class="m-0 text-2xl font-bold">Gestionar Instituciones Educativas</div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons">
    <p-button
      severity="success"
      label="Agregar"
      size="small"
      icon="pi pi-plus"
      (onClick)="agregarInstitucion()"
    />
  </ng-template>

  <form [formGroup]="formFiltroIe">
    <div class="grid mt-2">
      <div class="col-12 lg:col-4">
        <p-inputGroup>
          <p-inputGroupAddon>Nivel</p-inputGroupAddon>
          <p-dropdown
            [options]="nivel_tipos"
            [showClear]="true"
            formControlName="iNivelTipoId"
            placeholder="Seleccione un nivel"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
            (onChange)="filtrarIes()"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 lg:col-4">
        <p-inputGroup>
          <p-inputGroupAddon>UGEL</p-inputGroupAddon>
          <p-dropdown
            [options]="ugeles"
            [showClear]="true"
            formControlName="iUgelId"
            placeholder="Seleccione una UGEL"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
            (onChange)="filtrarIes()"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 lg:col-4">
        <p-inputGroup>
          <p-inputGroupAddon>Estado</p-inputGroupAddon>
          <p-dropdown
            [options]="[
              { iEstado: '1', cEstado: 'Activo' },
              { iEstado: '0', cEstado: 'Inactivo' },
            ]"
            optionValue="iEstado"
            optionLabel="cEstado"
            [showClear]="true"
            formControlName="iEstado"
            placeholder="Seleccione un estado"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
            (onChange)="filtrarIes()"
          />
        </p-inputGroup>
      </div>
      <div class="col-12">
        <p-inputGroup>
          <p-inputGroupAddon>Buscar</p-inputGroupAddon>
          <input
            pInputText
            formControlName="cTextoBusqueda"
            type="text"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
            (change)="filtrarIes()"
          />
        </p-inputGroup>
      </div>
    </div>
  </form>

  <app-table-primeng
    [data]="instituciones_filtradas"
    [columnas]="columnas"
    [actions]="acciones"
    [showCaption]="false"
    [showPaginator]="true"
    (accionBtnItem)="accionBtnInstituciones($event)"
    [scrollable]="true"
  />

  <app-agregar-mantenimiento-ie
    [showModal]="showModal"
    (closeModal)="cerrarModal()"
    [ie]="institucionSeleccionada"
    (recargarLista)="listarInstitucionesEducativas()"
  />
</p-panel>
