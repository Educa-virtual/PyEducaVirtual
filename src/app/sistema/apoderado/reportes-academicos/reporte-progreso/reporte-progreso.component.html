<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column gap-2">
      <span class="font-bold white-space-nowrap text-2xl m-0"> Reporte académico de progreso </span>
    </div>
  </ng-template>

  <p-messages severity="secondary">
    <ng-template pTemplate>
      Para cambiar el año académico, dirijase a la barra superior y debajo de "Año Escolar"
      seleccione otro año de la lista desplegable.
    </ng-template>
  </p-messages>
  <ng-template pTemplate="body">
    <div class="grid p-fluid mt-4">
      <div class="field col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary">Estudiante:</p-inputGroupAddon>
          <p-dropdown
            [options]="dataEstudiantes"
            optionLabel="cNombreCompleto"
            optionValue="iEstudianteId"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
            placeholder="Seleccione..."
            [(ngModel)]="estudianteSeleccionado"
            (onChange)="obtenerMatriculasEstudiante()"
          />
        </p-inputGroup>
      </div>
      <div class="field col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary">Matrícula:</p-inputGroupAddon>
          <p-dropdown
            [options]="dataMatriculas"
            optionLabel="cMatriculaMostrar"
            optionValue="iMatrId"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: '1', width: '100%' }"
            placeholder="Seleccione..."
            [(ngModel)]="matriculaSeleccionada"
            (onChange)="obtenerReporteAcademicoEstudiante()"
          />
        </p-inputGroup>
      </div>
    </div>
  </ng-template>
</p-panel>
<p-tabView [(activeIndex)]="activeTab" (onChange)="onTabChange($event)">
  <p-tabPanel header="Logro alcanzado" [headerStyleClass]="activeTab === 0 ? 'tab-activo' : ''">
    <div class="block mt-3">
      @if (courses.length > 0) {
        <app-tabla-reporte-progreso
          [courses]="courses"
          [iYAcadId]="matriculaSeleccionada?.iYAcadId"
          [iMatrId]="matriculaSeleccionada"
          [vista]="'apoderado'"
        ></app-tabla-reporte-progreso>
      }
    </div>
  </p-tabPanel>
  <p-tabPanel header="Horario" [headerStyleClass]="activeTab === 1 ? 'tab-activo' : ''">
    <app-horario-estudiante [lista]="horarioEstudiante" />
  </p-tabPanel>
  <p-tabPanel
    header="Calendario académico"
    [headerStyleClass]="activeTab === 2 ? 'tab-activo' : ''"
  >
    <app-calendario-estudiante [lista]="horarioEstudiante" />
  </p-tabPanel>
</p-tabView>
<p-dialog
  header="{{ opcion }}"
  [(visible)]="visibleHorario"
  [style]="{ width: '90%' }"
  [modal]="true"
>
  @switch (opcion) {
    @case ('Horario') {
      <app-horario-estudiante [lista]="horarioEstudiante" />
    }
    @case ('Calendario') {
      <app-calendario-estudiante [lista]="horarioEstudiante" />
    }
  }
</p-dialog>

<p-toast></p-toast>
