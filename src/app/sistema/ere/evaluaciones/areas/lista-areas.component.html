<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<app-container-page
  [title]="
    evaluacion === null
      ? 'Lista de áreas'
      : 'Lista de áreas de ' +
        evaluacion.cEvaluacionNombre +
        ' - nivel ' +
        evaluacion.cNivelEvalNombre
  "
  [actions]="[]"
>
  @if (mostrarMensajeVacio) {
    <p-messages [(value)]="mensajeInfo" [enableService]="false" [closable]="false" />
  } @else {
    <div class="flex flex-column md:flex-row md:justify-content-between gap-2 mb-4">
      <p-iconField iconPosition="left">
        <p-inputIcon styleClass="pi pi-search" />
        <input
          pInputText
          type="text"
          placeholder="Buscar por área..."
          class="w-full md:w-20rem"
          (input)="onFilterTable($event)"
        />
      </p-iconField>
    </div>

    <app-simple-lista-areas
      [iEvaluacionIdHashed]="iEvaluacionIdHashed"
      [evaluacion]="evaluacion"
      [cursosFromParent]="cursos"
      (dialogSubirArchivoEvent)="recibirDatosParaSubirArchivo($event)"
      (dialogConfigurarNivelLogroEvent)="recibirDatosParaConfigurarNivelLogro($event)"
      (dialogImportarResultados)="importarResultados($event)"
      (dialogGuardarResultadosOnline)="guardarResultadosOnline($event)"
      (solicitudActualizacion)="obtenerAreasPorEvaluacionyEspecialista()"
      (dialogActivarDescarga)="recibirDatosParaActivarDescarga($event)"
    >
      ></app-simple-lista-areas
    >
  }
</app-container-page>

<app-subir-archivo-preguntas
  #subirArchivoPreguntasRef
  (archivoSubidoEvent)="actualizarEstadoArchivoSubido($event)"
></app-subir-archivo-preguntas>

<app-importar-resultados
  #importarResultadosRef
  (archivoSubidoEvent)="actualizarEstadoResultadosImportados($event)"
></app-importar-resultados>

<app-guardar-resultados-online #guardarResultadosOnlineRef></app-guardar-resultados-online>

<app-configurar-nivel-logro #configurarNivelLogroRef></app-configurar-nivel-logro>

<app-activar-descarga
  #activarDescargaRef
  (actualizarEstadoDescargaEvent)="actualizarEstadoDescarga($event)"
></app-activar-descarga>
