<div class="grid">
  <div class="col-12 md:col-6">
    <p-inputGroup>
      <p-inputGroupAddon> Área </p-inputGroupAddon>
      <input
        class="group-element"
        disabled
        type="text"
        pInputText
        [value]="ie_curso?.cCursoNombre"
      />
    </p-inputGroup>
  </div>
  <div class="col-12 md:col-6">
    <p-inputGroup>
      <p-inputGroupAddon> Periodo </p-inputGroupAddon>
      <p-dropdown
        [(ngModel)]="iPeriodoId"
        [options]="periodos"
        placeholder="Seleccionar"
        [disabled]="true"
        [style]="{ flex: '1', width: '100%' }"
        styleClass="group-element"
      >
      </p-dropdown>
    </p-inputGroup>
  </div>
</div>
<br />

<form [formGroup]="formCompetencias">
  <div class="grid" *ngIf="controles_logros.length > 0">
    <div class="col-12">
      <p-table [value]="competencias">
        <ng-template pTemplate="header">
          <tr>
            <th width="40%">Competencias</th>
            <th width="15%">Nivel de logro</th>
            <th width="40%">Conclusión descriptiva</th>
            <th width="5%"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-competencias let-i="rowIndex">
          <tr>
            <td width="40%">
              {{ competencias.cCompetenciaNombre }}
            </td>
            <td width="15%">
              <p-autoComplete
                [formControl]="$any(controles_logros.at(i))?.controls['cEscalaCalifLetra']"
                [suggestions]="escalas_filtradas"
                (completeMethod)="filtrarEscala($event)"
                [dropdown]="escalas_filtradas.length < 6 ? true : false"
                [minLength]="999"
                [showEmptyMessage]="false"
                [style]="{ flex: '1', width: '100%' }"
                styleClass="group-element"
                optionLabel="label"
                (onBlur)="mantenerValorSeleccionado(i)"
                (onKeyup)="mantenerValorSeleccionado(i)"
                (onSelect)="seleccionarEscala($event, i)"
              />
            </td>
            <td width="40%">
              <textarea
                [formControl]="$any(controles_logros.at(i))?.controls['cDescripcion']"
                cdkTextareaAutosize
                #autosize="cdkTextareaAutosize"
                pInputTextarea
                rows="2"
                [style]="{ 'min-width': '200px' }"
                [minLength]="10"
                [maxlength]="350"
                [style.minHeight]="2"
                [style.maxHeight]="4"
                cdkAutosizeMinRows="2.5"
                cdkAutosizeMaxRows="4"
                (blur)="validarCambios(i)"
              ></textarea>
            </td>
            <td width="10%">
              <div class="flex gap-1">
                <p-button
                  size="small"
                  [disabled]="!controles_logros.at(i).value.bMostrarBoton"
                  icon="pi pi-undo"
                  severity="secondary"
                  pTooltip="Deshacer cambios"
                  tooltipPosition="top"
                  (click)="restaurarInicial(i)"
                />
                <p-button
                  size="small"
                  *ngIf="
                    !controles_logros.at(i).value.iResultadoCompId &&
                    !controles_logros.at(i).value.bMostrarBoton
                  "
                  icon="pi pi-pencil"
                  severity="danger"
                  pTooltip="Falta registrar"
                  tooltipPosition="top"
                  disabled
                />
                <p-button
                  size="small"
                  *ngIf="
                    controles_logros.at(i).value.iResultadoCompId &&
                    !controles_logros.at(i).value.bMostrarBoton
                  "
                  icon="pi pi-check"
                  severity="primary"
                  pTooltip="Logro registrado"
                  tooltipPosition="top"
                  disabled
                />
                <p-button
                  size="small"
                  *ngIf="controles_logros.at(i).value.bMostrarBoton"
                  icon="pi pi-save"
                  severity="success"
                  pTooltip="Cambios pendientes"
                  tooltipPosition="top"
                  (click)="actualizarLogro(i)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
  <p-toast></p-toast>
</form>
