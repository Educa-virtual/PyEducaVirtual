<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Lista de evaluaciones</div>
    </div>
  </ng-template>

  <ng-template pTemplate="icons" class="flex justify-content-center">
    <div class="flex gap-2">
      <p-button
        severity="success"
        pTooltip="Nueva evaluación"
        tooltipPosition="top"
        (click)="agregarEditarPregunta(null)"
        size="small"
        *ngIf="esEspecialistaUgel || esAdministradorDremo"
      >
        <i class="pi pi-fw pi-plus"></i>
        <span class="hidden md:inline ml-2">Nueva</span>
      </p-button>
    </div>
  </ng-template>

  <app-table-primeng
    [columnas]="columnas"
    [data]="data"
    (accionBtnItem)="accionBtnItemTable($event)"
    [(selectedRowData)]="selectedItems"
    [actions]="accionesTabla"
    [showPaginator]="true"
    [showCaption]="true"
  >
    <input type="text" />
  </app-table-primeng>
</p-panel>
<p-toast key="evaluaciones"></p-toast>

<app-asignar-horas-areas></app-asignar-horas-areas>
