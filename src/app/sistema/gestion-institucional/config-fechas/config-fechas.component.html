<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />
<p-toast />
<app-container-page
  title="Feriados nacionales"
  [actions]="containerActions"
  (accionBtnItem)="accionBtnItem($event)"
>
  <app-table-primeng
    [columnas]="columns"
    [data]="data"
    (accionBtnItem)="accionBtnItem($event)"
    [actions]="actions"
  />
</app-container-page>

<p-dialog
  [header]="dialogs.nationalHoliday.title"
  [(visible)]="dialogs.nationalHoliday.visible"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  [styleClass]="'dialog-responsive'"
  [resizable]="true"
  [maximizable]="true"
>
  <form [formGroup]="form">
    <div class="grid mt-2">
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Fecha</p-inputGroupAddon>
          <p-calendar
            appendTo="body"
            [showOnFocus]="false"
            inputStyleClass="group-element"
            formControlName="dtFeriado"
            [showIcon]="true"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Es recuperable</p-inputGroupAddon>
          <p-dropdown
            formControlName="bFeriadoEsRecuperable"
            [options]="[
              { label: 'SI', value: 1 },
              { label: 'NO', value: 0 },
            ]"
            [style]="{ flex: '1', width: '100%' }"
            styleClass="group-element"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12">
        <p-inputGroup>
          <p-inputGroupAddon>Nombre</p-inputGroupAddon>
          <input
            pInputText
            formControlName="cFeriadoNombre"
            appendTo="body"
            class="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12">
        <p-inputGroup>
          <p-inputGroupAddon>URL del documento</p-inputGroupAddon>
          <input
            pInputText
            formControlName="cDocumento"
            appendTo="body"
            class="group-element"
            [style]="{ flex: '1', width: '100%' }"
          />
        </p-inputGroup>
      </div>
    </div>
    <div class="flex justify-content-end mt-2">
      <p-button
        label="Guardar"
        [disabled]="form.invalid"
        severity="success"
        (onClick)="saveData()"
      />
    </div>
  </form>
</p-dialog>

<p-dialog
  [header]="dialogs.importNationalHolyday.title"
  [(visible)]="dialogs.importNationalHolyday.visible"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  [styleClass]="'dialog-responsive'"
  [resizable]="true"
  [maximizable]="true"
>
  <div class="flex justify-content-between flex-wrap my-3 gap-3 row-gap-2">
    <div class="flex gap-2 row-gap-2">
      <p-button
        (onClick)="nationalHolidayService.downloadTemplate()"
        severity="info"
        icon="pi pi-file-excel"
        label="Plantilla"
      />
      <app-btn-file-upload
        accept="*.xlsx"
        icon="pi pi-file-import"
        label="Cargar"
        [(ngModel)]="file"
        (fileChange)="fileChange($event)"
      />
    </div>
    <p-button
      [loading]="importLoading"
      (onClick)="importData()"
      severity="success"
      [disabled]="file ? false : true"
      icon="pi pi-database"
      label="Importar"
    />
  </div>

  <app-table-primeng [columnas]="columnsImport" [data]="dataImport" [showCaption]="true" />
</p-dialog>
