<p-panel>
  <ng-template pTemplate="header">
    <span class="text-2xl font-bold">Configurar año académico</span>
  </ng-template>

  <p-tabMenu
    #tabMenu
    [model]="items"
    scrollable="true"
    (activeItemChange)="scrollToActiveTab(activeItem)"
    [activeItem]="activeItem"
  >
    <ng-template pTemplate="item" let-item>
      <ng-container *ngIf="item.route">
        @if (items[activeItem] === item) {
          <a [routerLink]="item.route" class="p-menuitem-link" [title]="item.label">
            <span [class]="item.icon"></span>
            <span class="block ml-2">
              {{ item.label }}
            </span>
          </a>
        } @else {
          <a
            [routerLink]="item.route"
            class="p-menuitem-link text-color-secondary"
            [title]="item.label"
          >
            <span [class]="item.icon"></span>
            <span class="hidden md:block ml-2">
              {{ item.label }}
            </span>
          </a>
        }
      </ng-container>
    </ng-template>
  </p-tabMenu>
  <router-outlet></router-outlet>
</p-panel>
