<form [formGroup]="formBusqueda">
  <div class="grid p-fluid mt-4">
    <div class="col-12 md:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Estado</p-inputGroupAddon>
        <p-dropdown
          [options]="estados"
          styleClass="group-element"
          formControlName="bAmbienteEstado"
          [style]="{ flex: 1, width: '100%' }"
          showClear="true"
          appendTo="body"
          (onChange)="filtrarTabla()"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 md:col-7">
      <p-inputGroup>
        <p-inputGroupAddon>Buscar</p-inputGroupAddon>
        <input
          pInputText
          type="text"
          formControlName="textoBusqueda"
          (keyup)="filtrarTabla()"
          class="group-element"
          [style]="{ flex: 1, width: '100%' }"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 md:col-2">
      <p-button
        icon="pi pi-fw pi-plus"
        label="Agregar"
        (onClick)="agregarAmbiente()"
        severity="success"
        class="w-full"
      />
    </div>
  </div>
</form>

<app-table-primeng
  [columnas]="columns"
  [showCaption]="false"
  [data]="ambientes_filtrados"
  (accionBtnItem)="accionBtnItemTable($event)"
  [showPaginator]="true"
  [(selectedRowData)]="accionBtnItemTable"
  [actions]="actions"
/>

<div class="flex justify-content-end">
  <p-button (onClick)="siguienteTab()" label="Siguiente" />
</div>

<p-dialog
  header="{{ caption }}"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  (onHide)="cerrarDialogo()"
  [resizable]="true"
  [maximizable]="true"
>
  <form [formGroup]="form">
    <div class="grid p-fluid mt-3">
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Nombre *</p-inputGroupAddon>
          <input
            pInputText
            type="text"
            formControlName="cAmbienteNombre"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Aforo *</p-inputGroupAddon>
          <input
            pInputText
            type="number"
            formControlName="iAmbienteAforo"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Estado *</p-inputGroupAddon>
          <p-dropdown
            [options]="estados"
            formControlName="bAmbienteEstado"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Tipo</p-inputGroupAddon>
          <p-dropdown
            [options]="tipos_ambientes"
            formControlName="iTipoAmbienteId"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
            showClear="true"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Ubicación</p-inputGroupAddon>
          <p-dropdown
            [options]="ubicaciones_ambientes"
            formControlName="iUbicaAmbId"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Piso</p-inputGroupAddon>
          <p-dropdown
            [options]="pisos_ambientes"
            [style]="{ width: '100%' }"
            formControlName="iPisoAmbid"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Uso</p-inputGroupAddon>
          <p-dropdown
            [options]="usos_ambientes"
            formControlName="iUsoAmbId"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Condición</p-inputGroupAddon>
          <p-dropdown
            [options]="estados_ambientes"
            formControlName="iEstadoAmbId"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Área (m2)</p-inputGroupAddon>
          <input
            pInputText
            type="number"
            formControlName="iAmbienteArea"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>

      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Descripción</p-inputGroupAddon>
          <input pInputText formControlName="cAmbienteDescripcion" class="group-element" />
        </p-inputGroup>
      </div>
      <div class="col-12">
        <p-inputGroup class="vertical-group">
          <p-inputGroupAddon>Observaciones</p-inputGroupAddon>
          <input
            pInputText
            formControlName="cAmbienteObs"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
    </div>
  </form>

  <div class="flex justify-content-end">
    <p-button
      *ngIf="option === 'crear'"
      label="Guardar"
      [disabled]="form.invalid"
      (onClick)="guardarAmbiente()"
    />
    <p-button
      *ngIf="option === 'editar'"
      label="Editar"
      [disabled]="form.invalid"
      (onClick)="actualizarAmbiente()"
      styleClass="p-button-warning"
    />
  </div>
</p-dialog>

<p-toast></p-toast>
