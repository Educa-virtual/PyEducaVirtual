<form [formGroup]="formBusqueda">
  <div class="grid p-fluid mt-3">
    <div class="col-12 md:col-6">
      <p-inputGroup>
        <p-inputGroupAddon>Grado</p-inputGroupAddon>
        <p-dropdown
          [options]="nivel_grados"
          formControlName="iNivelGradoId"
          [showClear]="false"
          [filter]="true"
          appendTo="body"
          styleClass="group-element"
          [style]="{ flex: 1, width: '100%' }"
          (onChange)="filtrarTabla()"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 md:col-6">
      <p-inputGroup>
        <p-inputGroupAddon>Sección</p-inputGroupAddon>
        <p-dropdown
          [options]="secciones"
          formControlName="iSeccionId"
          [showClear]="false"
          [filter]="true"
          appendTo="body"
          styleClass="group-element"
          [style]="{ flex: 1, width: '100%' }"
          (onChange)="filtrarTabla()"
        />
      </p-inputGroup>
    </div>
  </div>
</form>

<app-table-primeng
  [columnas]="columns"
  [showCaption]="false"
  [data]="ie_cursos_filtrados"
  (accionBtnItem)="accionBtnItemTable($event)"
  [showPaginator]="false"
  [(selectedRowData)]="accionBtnItemTable"
  [actions]="actions"
/>

<div class="flex justify-content-end mt-3">
  <p-button (onClick)="anterior()" label="Anterior" severity="secondary" />
</div>

<p-dialog
  header="Asignar áreas curriculares"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '85vw', '640px': '100vw' }"
  [style]="{
    width: '75vw',
    maxWidth: '100vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  (onHide)="cerrarDialogo()"
  [resizable]="true"
  [maximizable]="true"
>
  <ng-content>
    <p-tabView [(activeIndex)]="activeTab">
      <!-- Tab 1: Historial -->
      <p-tabPanel header="Historial" *ngIf="activeTab === 0" [disabled]="true">
        <div class="flex justify-content-end gap-2 mb-2">
          <p-button
            label="Nuevo"
            icon="pi pi-plus"
            severity="success"
            (click)="agregarDocenteCurso()"
          />
        </div>
        <app-table-primeng
          [columnas]="columnsHistorial"
          [showCaption]="false"
          (accionBtnItem)="accionBtnItemTableHistorial($event)"
          [data]="docente_cursos_historial"
          [(selectedRowData)]="accionBtnItemTableHistorial"
          [showPaginator]="true"
          [actions]="actionsHistorial"
        />
      </p-tabPanel>

      <!-- Tab 2: Formulario -->
      <p-tabPanel header="Formulario" *ngIf="activeTab === 1" [disabled]="true">
        <form [formGroup]="form">
          <div class="grid p-fluid mt-3">
            <div class="col-12 md:col-8">
              <p-inputGroup>
                <p-inputGroupAddon>Grado</p-inputGroupAddon>
                <input
                  pInputText
                  type="text"
                  formControlName="cGradoNombre"
                  class="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
            <div class="col-12 md:col-4">
              <p-inputGroup>
                <p-inputGroupAddon>Sección</p-inputGroupAddon>
                <input
                  pInputText
                  type="text"
                  formControlName="cSeccionNombre"
                  class="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
            <div class="col-12 md:col-8">
              <p-inputGroup>
                <p-inputGroupAddon>Área curricular</p-inputGroupAddon>
                <input
                  pInputText
                  formControlName="cCursoNombre"
                  class="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
            <div class="col-12 md:col-4">
              <p-inputGroup>
                <p-inputGroupAddon>Horas</p-inputGroupAddon>
                <input
                  pInputText
                  formControlName="iTotalHoras"
                  class="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
            <div class="col-12 md:col-12">
              <p-inputGroup>
                <p-inputGroupAddon>Docente</p-inputGroupAddon>
                <p-dropdown
                  [options]="docentes"
                  formControlName="iDocenteId"
                  [filter]="true"
                  [showClear]="true"
                  styleClass="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
            <div class="col-12 md:col-12">
              <p-inputGroup class="vertical-group">
                <p-inputGroupAddon>Observaciones</p-inputGroupAddon>
                <input
                  pInputText
                  formControlName="cDocCursoObservaciones"
                  class="group-element"
                  [style]="{ flex: 1, width: '100%' }"
                  appendTo="body"
                />
              </p-inputGroup>
            </div>
          </div>
        </form>
        <div class="flex justify-content-end mt-3 gap-2">
          <p-button
            label="Ver todos"
            icon="pi pi-arrow-left"
            severity="secondary"
            (click)="cambiarTab(0)"
          />
          <p-button
            *ngIf="bEditar && !bSoloVer"
            label="Editar"
            [disabled]="form.invalid"
            (onClick)="actualizarDocenteCurso()"
            styleClass="p-button-warning"
          />
          <p-button
            *ngIf="!bEditar && !bSoloVer"
            label="Guardar"
            [disabled]="form.invalid"
            (onClick)="guardarDocenteCurso()"
            styleClass="p-button-primary"
          />
        </div>
      </p-tabPanel>
    </p-tabView>
  </ng-content>
</p-dialog>
