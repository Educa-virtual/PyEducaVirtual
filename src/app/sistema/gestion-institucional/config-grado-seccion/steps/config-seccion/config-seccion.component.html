<form [formGroup]="formBusqueda">
  <div class="grid p-fluid mt-4">
    <div class="col-12 md:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Grado</p-inputGroupAddon>
        <p-dropdown
          [options]="nivel_grados"
          styleClass="group-element"
          formControlName="iNivelGradoId"
          [style]="{ flex: 1, width: '100%' }"
          showClear="true"
          appendTo="body"
          (onChange)="filtrarTabla()"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 md:col-7">
      <p-inputGroup>
        <p-inputGroupAddon>Buscar</p-inputGroupAddon>
        <input
          pInputText
          type="text"
          formControlName="textoBusqueda"
          (keyup)="filtrarTabla()"
          class="group-element"
          [style]="{ flex: 1, width: '100%' }"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 md:col-2">
      <p-button
        icon="pi pi-fw pi-plus"
        label="Agregar"
        (onClick)="agregarGradoSeccion()"
        severity="success"
        class="w-full"
      />
    </div>
  </div>
</form>

<app-table-primeng
  [columnas]="columns"
  [showCaption]="false"
  [data]="grados_secciones_filtrados"
  (accionBtnItem)="accionBtnItemTable($event)"
  [showPaginator]="true"
  [(selectedRowData)]="selectedItems"
  [actions]="actions"
/>

<div class="flex justify-content-end">
  <p-button (onClick)="siguienteTab()" label="Siguiente" />
</div>

<p-dialog
  header="{{ caption }}"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
  [style]="{
    width: '89rem',
    maxWidth: '95vw',
    maxHeight: '95vh',
  }"
  [modal]="true"
  [closable]="true"
  [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
  (onHide)="cerrarDialogo()"
  [resizable]="true"
  [maximizable]="true"
>
  <form [formGroup]="form">
    <div class="grid p-fluid mt-3">
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Grado *</p-inputGroupAddon>
          <p-dropdown
            [options]="nivel_grados"
            formControlName="iNivelGradoId"
            [showClear]="true"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Sección *</p-inputGroupAddon>
          <p-dropdown
            [options]="secciones"
            formControlName="iSeccionId"
            [showClear]="true"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Turno *</p-inputGroupAddon>
          <p-dropdown
            [options]="turnos"
            formControlName="iTurnoId"
            [showClear]="true"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Modalidad *</p-inputGroupAddon>
          <p-dropdown
            [options]="modalidades_servicio"
            formControlName="iModalServId"
            [showClear]="true"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Ambiente *</p-inputGroupAddon>
          <p-dropdown
            [options]="ambientes"
            formControlName="iIieeAmbienteId"
            [showClear]="true"
            appendTo="body"
            styleClass="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Vacantes *</p-inputGroupAddon>
          <p-inputNumber
            formControlName="iDetConfCantEstudiantes"
            [min]="1"
            [step]="1"
            placeholder="Indique"
            [useGrouping]="false"
            [showButtons]="true"
            styleClass="group-element"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Nombre *</p-inputGroupAddon>
          <input
            pInputText
            type="text"
            formControlName="cDetConfNombreSeccion"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon>Observaciones</p-inputGroupAddon>
          <input
            pInputText
            type="text"
            formControlName="cDetConfObs"
            class="group-element"
            [style]="{ flex: 1, width: '100%' }"
          />
        </p-inputGroup>
      </div>
    </div>
  </form>

  <div class="flex justify-content-end">
    <p-button
      label="Guardar"
      [disabled]="form.invalid"
      (onClick)="guardarGradoSeccion()"
      severity="success"
      *ngIf="!bActualizar"
    />
    <p-button
      label="Editar"
      [disabled]="form.invalid"
      (onClick)="actualizarGradoSeccion()"
      styleClass="p-button-warning"
      severity="warning"
      *ngIf="bActualizar"
    />
  </div>
</p-dialog>

<p-toast></p-toast>
