
<form [formGroup]="form">
  <div class="grid p-fluid mt-3">
    <div class="col-12 md:col-6">
      <div class="grid p-fluid">
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Año escolar</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cYAcadNombre"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Modalidad educativa</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cNivelNombre"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Nivel modular</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cNivelTipoNombre"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Modelo de servicio de atención</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cServEdNombre"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup>
            <p-inputGroupAddon>Estado *</p-inputGroupAddon>
            <p-dropdown
              [options]="estados_configuracion"
              formControlName="iEstadoConfigId"
              styleClass="group-element"
              [style]="{ flex: 1, width: '100%' }"
            />
          </p-inputGroup>
        </div>
      </div>
    </div>
    <div class="col-12 md:col-6">
      <div class="grid p-fluid">
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Observaciones</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cConfigDescripcion"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup styleClass="vertical-group">
            <p-inputGroupAddon>
              <p-inputSwitch formControlName="bConfigEsBilingue" />
              <span>IE Educación Intercultural Bilingüe (EIB)</span>
            </p-inputGroupAddon>
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Resolución Directoral de aprobación</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cConfigNroRslAprobacion"
              class="group-element"
            />
          </p-inputGroup>
        </div>
        @if (hay_archivo) {
          <div class="col-12">
            <p-inputGroup styleClass="vertical-group">
              <p-inputGroupAddon>
                <a
                  type="button"
                  href="#"
                  class="underline text-white"
                  (click)="descargarArchivo(null, $event)"
                >
                  <i class="pi pi-fw pi-download mr-2"></i>
                  <span>Descargar Resolución Directorial</span>
                </a>
              </p-inputGroupAddon>
            </p-inputGroup>
          </div>
        }
        <div class="col-12">
          <p-inputGroup styleClass="vertical-group">
            <p-inputGroupAddon>
              <span>Cargar Resolución Directorial (PDF máximo 10MB)</span>
            </p-inputGroupAddon>
            <p-fileUpload
              #fileUpload
              chooseLabel="Subir PDF"
              name="archivo"
              [multiple]="false"
              accept=".pdf"
              fileLimit="1"
              showUploadButton="false"
              invalidFileSizeMessageSummary="{0}: Tamaño de archivo inválido, "
              invalidFileSizeMessageDetail="el máximo tamaño permitido es {0}."
              invalidFileTypeMessageSummary="{0}: Tipo de archivo inválido, "
              invalidFileTypeMessageDetail="el tipo de archivo permitido es: {0}."
              invalidFileLimitMessageDetail="solo debe subir {0} archivo."
              invalidFileLimitMessageSummary="Excedió el límite de archivos permitidos, "
              maxFileSize="10485760"
              (onSelect)="handleArchivo($event)"
              (onClear)="handleArchivo($event)"
              (onRemove)="handleArchivo($event)"
            >
            </p-fileUpload>
          </p-inputGroup>
        </div>
      </div>
    </div>
  </div>
</form>


<div class="flex justify-content-end">
  <p-button
    (onClick)="confirmarCambios()"
    [disabled]="!form.valid"
    label="Actualizar"
    severity="warning"
  />
</div>

<p-toast></p-toast>
