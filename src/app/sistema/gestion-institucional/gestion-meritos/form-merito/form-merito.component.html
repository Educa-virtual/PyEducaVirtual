<p-toast />
<p-dialog
  header="Formulario de Méritos"
  [modal]="true"
  [(visible)]="mostrar"
  (onHide)="onHideDialog()"
  [style]="{ width: '55rem', height: '55rem' }"
>
  <form [formGroup]="formMerito" class="mt-5">
    <div class="grid">
      <div class="col-12 md:col-5">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Tipo (*)</p-inputGroupAddon>
          <p-dropdown
            [style]="{ width: '100%' }"
            [options]="tipo_documento"
            optionLabel="cTipoIdentSigla"
            optionValue="iTipoIdentId"
            formControlName="iTipoIdentId"
            appendTo="body"
          />
        </p-inputGroup>
      </div>

      <div class="col-12 md:col-5" *ngIf="formMerito.get('iTipoIdentId')?.value > 0">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Documento (*)</p-inputGroupAddon>
          <input
            pInputText
            id="cDocumento"
            formControlName="cDocumento"
            aria-describedby="cDocumento-help"
            [ngClass]="{ 'input-invalid': esInvalido('cDocumento') }"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-2" *ngIf="formMerito.get('iTipoIdentId')?.value > 0">
        <p-button
          label=""
          icon="pi pi-search"
          (onClick)="getPersona(0)"
          styleClass="w-full"
        ></p-button>
      </div>

      <div class="col-12">
        <p-message styleClass="w-full" severity="{{ _severity }}" text="{{ mensaje }}"></p-message>
      </div>
    </div>

    <div class="grid mt-3" *ngIf="formMerito.get('bDocumentoVerificado')?.value">
      <div class="col-12 xl:col-12 lg:col-12 md:col-12 sm:col-12">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold"
            >Registrar tipo de mérito(*)</p-inputGroupAddon
          >
          <p-dropdown
            [style]="{ width: '100%' }"
            [options]="tipo_merito()"
            optionLabel="cTipoMerito"
            optionValue="iTipoMeritoId"
            formControlName="iTipoMeritoId"
            appendTo="body"
            [ngClass]="{ 'input-invalid': esInvalido('iTipoMeritoId') }"
          />
        </p-inputGroup>
      </div>

      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold"
            >Fecha de mérito(*)</p-inputGroupAddon
          >
          <p-calendar
            id="dtMeritoFecha"
            formControlName="dtMeritoFecha"
            dateFormat="dd/mm/yy"
            showIcon="true"
            [styleClass]="'w-full'"
            aria-describedby="dtMeritoFecha-help"
            appendTo="body"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 md:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Estado(*)</p-inputGroupAddon>
          <p-dropdown
            [options]="[
              { iEstado: 1, cEstado: 'Activo' },
              { iEstado: 0, cEstado: 'Inactivo' },
            ]"
            optionValue="iEstado"
            optionLabel="cEstado"
            [showClear]="true"
            formControlName="iEstado"
            placeholder="Seleccione un estado"
            styleClass="w-full"
            appendTo="body"
          />
        </p-inputGroup>
      </div>

      <div class="col-12">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Descripción (*)</p-inputGroupAddon>
          <input
            pInputText
            id="cMeritoDescripcion"
            formControlName="cMeritoDescripcion"
            aria-describedby="cMeritoDescripcion-help"
            [ngClass]="{ 'input-invalid': esInvalido('cMeritoDescripcion') }"
          />
        </p-inputGroup>
      </div>

      <div class="col-12">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Referencia</p-inputGroupAddon>
          <input
            pInputText
            id="cMeritoRef"
            formControlName="cMeritoRef"
            aria-describedby="cMeritoRef-help"
            [ngClass]="{ 'input-invalid': esInvalido('cMeritoRef') }"
          />
        </p-inputGroup>
      </div>

      <div class="col-12 xl:col-6 lg:col-6 md:col-6 sm:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Puesto</p-inputGroupAddon>
          <p-inputNumber
            inputStyleClass="w-full"
            placeholder="00"
            inputId="iMeritoPuesto"
            [showButtons]="true"
            formControlName="iMeritoPuesto"
            aria-describedby="iMeritoPuesto-help"
            [min]="0"
            [ngClass]="{ 'input-invalid': esInvalido('iMeritoPuesto') }"
          />
        </p-inputGroup>
      </div>

      <div class="col-12 xl:col-6 lg:col-6 md:col-6 sm:col-6">
        <p-inputGroup>
          <p-inputGroupAddon class="mi-addon-primary font-bold">Puntaje</p-inputGroupAddon>
          <p-inputNumber
            inputId="iMeritoPuntaje"
            formControlName="iMeritoPuntaje"
            mode="decimal"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [showButtons]="true"
            placeholder="00"
            [min]="0"
            inputStyleClass="w-full"
            aria-describedby="iMeritoPuntaje-help"
            [ngClass]="{ 'input-invalid': esInvalido('iMeritoPuesto') }"
          >
          </p-inputNumber>
        </p-inputGroup>
      </div>
      <div class="col-12 xl:col-12 lg:col-12 md:col-12 sm:col-12">
        <p-button
          styleClass="uppercase w-full"
          type="submit"
          [label]="this.formMerito.value.iMeritoId ? 'Actualizar' : 'Guardar'"
          [disabled]="formMerito.invalid"
          [severity]="this.formMerito.value.iMeritoId ? 'warning' : 'success'"
          (onClick)="guardarMerito()"
        ></p-button>
      </div>
    </div>
  </form>
  <!-- <div class="block">Los parámetros en (*) son obligatorios</div> -->
</p-dialog>
