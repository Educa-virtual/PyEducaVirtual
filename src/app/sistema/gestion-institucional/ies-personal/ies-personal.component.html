<app-container-page
  title="Personal de la Institución educativa"
  [actions]="accionesPrincipal"
  (accionBtnItem)="accionBtnItemTable($event)"
>
  <div class="card">
    <app-table-primeng
      [columnas]="columns"
      [showCaption]="true"
      [data]="personal_ies"
      (accionBtnItem)="accionBtnItemTable($event)"
      [showPaginator]="true"
      [(selectedRowData)]="selectedItems"
      [actions]="actions"
    >
      <!-- <ng-container slot="caption-content"> </ng-container> -->
    </app-table-primeng>
    <ng-container slot="caption-content"> </ng-container>
  </div>
</app-container-page>

<p-dialog
  header="{{ caption }}"
  [(visible)]="visible"
  [style]="{ width: '56rem' }"
  [modal]="true"
  [contentStyle]="{ overflow: 'auto' }"
  [closable]="true"
  [resizable]="true"
  [maximizable]="true"
>
  <ng-content>
    <form [formGroup]="form">
      <div class="grid p-fluid mt-3">
        <input pInputText type="hidden" formControlName="iPersIeId" class="p-inputtext-sm" />

        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Seleccionar cargo</p-inputGroupAddon>
            <p-dropdown
              [options]="cargos"
              formControlName="iPersCargoId"
              optionLabel="cPersCargoNombre"
              [checkmark]="true"
              optionValue="iPersCargoId"
              [filter]="true"
              [showClear]="true"
              [appendTo]="'body'"
              (onChange)="onCargoSeleccionado($event)"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Total de horas</p-inputGroupAddon>
            <p-inputNumber
              formControlName="iHorasLabora"
              aria-describedby="iHorasLabora-help"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
          <small
            id="iHorasLabora-help"
            class="p-error"
            *ngIf="form.get('iHorasLabora')?.invalid && form.get('iHorasLabora')?.touched"
          >
            Ingrese un número válido mayor de 1 a 40.
          </small>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Tipo de documento *</p-inputGroupAddon>
            <p-dropdown
              [options]="tipos_documentos"
              formControlName="iTipoIdentId"
              optionLabel="nombre"
              optionValue="id"
              [filter]="true"
              [showClear]="true"
              [appendTo]="'body'"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>
              <p-button
                label="Validar"
                icon="pi pi-search"
                severity="success"
                (onClick)="validarPersona()"
                *ngIf="!form.get('iPersIeId')?.value"
              />
              Documento
            </p-inputGroupAddon>
            <input
              pInputText
              id="cPersDocumento"
              (click)="validarPersona()"
              formControlName="cPersDocumento"
              aria-describedby="cPersDocumento-help"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
            <input type="hidden" formControlName="iPersId" />
          </p-inputGroup>
        </div>

        <div class="field col-12" *ngIf="mensaje">
          <p-message [severity]="sever" [text]="mensaje" styleClass="p-mr-2"></p-message>
        </div>

        @if (option) {
          <div class="field col-12 md:col-12">
            <div class="separator-with-text">
              <span>Información de NEXUS</span>
            </div>
          </div>

          <div class="col-12 md:col-6">
            <p-inputGroup class="vertical-group">
              <p-inputGroupAddon>Fecha inicio</p-inputGroupAddon>
              <p-calendar
                formControlName="dtInicio"
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="dtInicio"
                [appendTo]="'body'"
                inputStyleClass="group-element"
                [style]="{ flex: '1', width: '100%' }"
              />
            </p-inputGroup>
          </div>
          <div class="col-12 md:col-6">
            <p-inputGroup class="vertical-group">
              <p-inputGroupAddon>Fecha fin</p-inputGroupAddon>
              <p-calendar
                formControlName="dtFin"
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="dtFin"
                [appendTo]="'body'"
                inputStyleClass="group-element"
                [style]="{ flex: '1', width: '100%' }"
              />
            </p-inputGroup>
          </div>
          <div class="col-12 md:col-4">
            <p-inputGroup class="vertical-group">
              <p-inputGroupAddon>Nexus</p-inputGroupAddon>
              <input
                pInputText
                id="iCodigoNexus"
                formControlName="iCodigoNexus"
                aria-describedby="iCodigoNexus-help"
                class="group-element"
                [style]="{ flex: '1', width: '100%' }"
              />
            </p-inputGroup>
          </div>
          <div class="col-12 md:col-8">
            <p-inputGroup class="vertical-group">
              <p-inputGroupAddon>Documento de aprobación</p-inputGroupAddon>
              <input
                pInputText
                id="cResolucion"
                formControlName="cResolucion"
                aria-describedby="cResolucion-help"
                class="group-element"
                [style]="{ flex: '1', width: '100%' }"
              />
            </p-inputGroup>
          </div>
        }
        <div class="col-12 md:col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Observación</p-inputGroupAddon>
            <input
              pInputText
              id="cMotivo"
              formControlName="cMotivo"
              aria-describedby="cMotivo-help"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
      </div>
      @if (c_accion === 'editar') {
        <p-button
          label="Editar"
          [disabled]="form.invalid"
          (onClick)="accionBtnItem('editar')"
          styleClass="p-button-warning"
          icon="pi pi-save"
        />
      }
      @if (c_accion === 'agregar') {
        <p-button
          label="Guardar"
          [disabled]="form.invalid"
          (onClick)="accionBtnItem('guardar')"
          styleClass="p-button-primary"
          icon="pi pi-save"
        />
      }
    </form>
  </ng-content>
</p-dialog>
