<app-container-page
  title="Información de la Institución"
  [actions]="accionesPrincipal"
  (accionBtnItem)="confirmar($event)"
>
  <p-toast />

  <div class="grid p-fluid mt-3">
    <div class="field col-12 xl:col-4 lg:col-6">
      <p-fieldset legend="Insignia Institucional" [toggleable]="false">
        <div class="grid">
          <div class="col-12 xl:col-12 lg:col-12 md:col-6 sm:col-6 text-center">
            <img [src]="logo" alt="Logo del proyecto" height="90" style="overflow: hidden" />
            <div class="block font-medium">Código modular</div>
            <div class="block font-bold">{{ perfil.cIieeCodigoModular }}</div>
          </div>

          <div class="col-12 xl:col-12 lg:col-12 md:col-6 sm:col-6">
            <p-fileUpload
              #escudo
              mode="basic"
              chooseLabel="Subir"
              chooseIcon="pi pi-upload"
              styleClass="block mb-1"
              name="escudo"
              accept="image/*"
              maxFileSize="1000000"
              (onSelect)="subirImagen($event, escudo)"
            >
            </p-fileUpload>
            <p-button
              styleClass="block"
              icon="pi pi-save"
              label="Guardar"
              severity="success"
              (click)="guardarEscudo()"
            />
          </div>
        </div>
      </p-fieldset>
    </div>
    <div class="field col-12 xl:col-8 lg:col-6">
      <form [formGroup]="form">
        <p-fieldset legend="Información de la Institución" [toggleable]="false">
          <div class="grid p-fluid mt-2">
            <div class="field col-12 xl:col-6 lg:col-12 md:col-6 sm:col-6">
              <span class="p-float-label">
                <input
                  pInputText
                  id="cIieeNombre"
                  formControlName="cIieeNombre"
                  aria-describedby="cIieeNombre-help"
                />
                <label for="cIieeNombre">Nombre de la Institución </label>
              </span>
            </div>

            <div class="field col-12 xl:col-6 lg:col-12 md:col-6 sm:col-6">
              <span class="p-float-label">
                <input
                  pInputText
                  id="cIieeRUC"
                  formControlName="cIieeRUC"
                  aria-describedby="cIieeRUC-help"
                />
                <label for="cIieeRUC">RUC</label>
              </span>
            </div>
          </div>
          <div class="grid p-fluid mt-2">
            <div class="field col-12 xl:col-6 lg:col-12 md:col-6 sm:col-6">
              <span class="p-float-label">
                <input
                  pInputText
                  id="cIieeRslCreacion"
                  formControlName="cIieeRslCreacion"
                  aria-describedby="cIieeRslCreacion-help"
                />
                <label for="cIieeRslCreacion">Resolución de creación</label>
              </span>
            </div>
            <div class="field col-12 xl:col-6 lg:col-12 md:col-6 sm:col-6">
              <span class="p-float-label">
                <input
                  pInputText
                  id="cIieeDireccion"
                  formControlName="cIieeDireccion"
                  aria-describedby="cIieeDireccion-help"
                />
                <label for="cIieeDireccion">Dirección</label>
              </span>
            </div>
            <div class="field col-12">
              <label for="cIieeUrlReglamentoInterno">Reglamento</label>
              <p-inputGroup>
                <p-inputGroupAddon>
                  <i class="pi pi-link" style="color: #333437"></i>
                </p-inputGroupAddon>
                <input
                  type="text"
                  pInputText
                  [placeholder]="filesUrl ? filesUrl['nombre'] : 'seleccionar reglamento'"
                  class="w-full p-inputtext-sm opacity-100"
                  formControlName="cIieeUrlReglamentoInterno"
                  readonly
                />
                <button
                  pButton
                  pRipple
                  type="button"
                  severity="primary"
                  class="p-button-primary btn-file-image"
                >
                  <i class="pi pi-upload"></i
                  ><input type="file" (change)="subirReglamento($event)" accept=".pdf" />
                </button>
                <button
                  type="button"
                  (click)="descargarArchivo(filesUrl ? filesUrl['enlace'] : null)"
                  [disabled]="!filesUrl"
                  pButton
                  icon="pi pi-eye"
                  class="p-button-info"
                >
                  &nbsp;
                </button>
              </p-inputGroup>
            </div>
            <div class="col-12 xl:col-offset-6 xl:col-6 lg:col-12 md:col-12 sm:col-12">
              <p-button
                styleClass="block"
                icon="pi pi-save"
                label="Actualizar Datos"
                severity="success"
                (click)="btnItem('update')"
              />
            </div>
          </div>
        </p-fieldset>
      </form>
    </div>
  </div>
</app-container-page>
