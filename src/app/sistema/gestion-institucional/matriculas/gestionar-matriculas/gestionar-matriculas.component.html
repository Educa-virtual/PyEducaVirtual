<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Gestionar matrículas</div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons" class="flex flex-column flex-1">
    <div class="flex flex-wrap gap-2 justify-content-end">
      <p-button
        size="small"
        severity="success"
        pTooltip="Registrar matrícula"
        tooltipPosition="left"
        (click)="agregarMatricula()"
      >
        <i class="pi pi-fw pi-plus"></i>
        <span class="ml-2 hidden sm:block">Registrar</span>
      </p-button>
    </div>
  </ng-template>

  <form [formGroup]="form">
    <div class="grid">
      <div class="col-12 lg:col-6 m-0">
        <p-inputGroup>
          <p-inputGroupAddon>Grado</p-inputGroupAddon>
          <p-dropdown
            [options]="nivel_grados"
            formControlName="iNivelGradoId"
            optionLabel="nombre"
            styleClass="group-element"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
            [appendTo]="'body'"
            placeholder="Seleccione un grado"
          />
        </p-inputGroup>
      </div>
      <div class="col-12 lg:col-6 m-0">
        <p-inputGroup>
          <p-inputGroupAddon>Sección</p-inputGroupAddon>
          <p-dropdown
            [options]="secciones"
            formControlName="iSeccionId"
            optionLabel="nombre"
            styleClass="group-element"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
            [appendTo]="'body'"
            placeholder="Seleccione una sección"
          ></p-dropdown>
        </p-inputGroup>
      </div>
    </div>
  </form>

  <app-table-primeng
    [columnas]="columns"
    [showCaption]="true"
    [data]="matriculas_filtradas"
    (accionBtnItem)="accionBtnItemTable($event)"
    [showPaginator]="true"
    sortMode="single"
    sortField="dtMatrFecha"
    [sortOrder]="0"
    [(selectedRowData)]="selectedItems"
    [actions]="actions"
    [showSearchTable]="false"
    [indiceColumnaBuscar]="3"
  >
  </app-table-primeng>
  <ng-container slot="caption-content"> </ng-container>

  <p-dialog
    [(visible)]="bApoderado"
    [breakpoints]="{ '960px': '95vw', '640px': '100vw' }"
    [style]="{
      width: '89rem',
      maxWidth: '95vw',
      height: soloLectura ? '35rem' : '80vh',
      maxHeight: '95vh',
    }"
    [modal]="true"
    [closable]="true"
    [contentStyle]="{ overflow: 'auto', padding: '1rem' }"
    [styleClass]="'dialog-responsive'"
    (onHide)="limpiarModalApoderado()"
    [resizable]="true"
    [maximizable]="true"
  >
    <ng-template pTemplate="header">
      <div class="flex flex-column">
        <div class="flex text-2xl font-bold">Gestionar apoderados</div>
        <div class="flex">{{ estudianteNombreCompleto }}</div>
      </div>
    </ng-template>
    <app-matricula-apoderado
      [iEstudianteId]="iEstudianteId"
      [estudiante]="estudianteSeleccionado"
      [iCredId]="iCredId"
      [visible]="bApoderado"
      (closeDialog)="bApoderado = false"
      [soloLectura]="soloLectura"
    >
    </app-matricula-apoderado>
  </p-dialog>
</p-panel>

<p-dialog
  header="{{ caption }}"
  [(visible)]="visible_desercion"
  [style]="{ width: '90rem' }"
  [modal]="true"
  [resizable]="true"
  [maximizable]="true"
  [closable]="true"
  [draggable]="true"
  appendTo="body"
  [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
>
  <p-splitter
    [panelSizes]="[30, 60]"
    [style]="{ height: '90%' }"
    styleClass="flex-column lg:flex-row"
  >
    <!--Bloque para buscador-->
    <ng-template pTemplate>
      <p-fieldset legend="Registrar deserción" [toggleable]="true">
        <app-form-desercion
          (accionBtnItem)="accionBtnItemTable($event)"
          [titulo]="caption"
          [matricula]="matricula"
          [grado]="grado"
          [matriculas_filtradas]="matriculas"
          [tipo_deserciones]="tipo_desercion"
          [bValido]="update"
          [desercion]="desercion"
        />
      </p-fieldset>
    </ng-template>
    <ng-template pTemplate>
      <div [style]="{ width: '100%' }">
        <div class="card grid">
          <div class="col-12">
            <p-tabView [(activeIndex)]="activeIndex">
              <p-tabPanel>
                <ng-template pTemplate="header">
                  <div class="flex align-items-center">
                    <p-avatar icon="pi pi-address-book" shape="circle" />
                    <span class="font-bold white-space-nowrap m-0"> Historial de matrícula </span>
                  </div>
                </ng-template>

                <div class="flex align-items-center">
                  <p-avatar icon="pi pi-user" shape="circle" />
                  <span class="font-bold text-center m-0">
                    Historial de deserciones - {{ matricula.cPersNombreCompleto }}
                  </span>
                </div>
                <p-message
                  severity="info"
                  text="No cuenta con historial de deserciones."
                  *ngIf="!deserciones || deserciones.length === 0"
                ></p-message>
                <br />
                <div *ngIf="deserciones && deserciones.length > 0">
                  <app-historial-desercion
                    [deserciones]="deserciones"
                    (accionBtnItem)="accionBtnItemTable($event)"
                  />
                </div>
              </p-tabPanel>
            </p-tabView>
          </div>
        </div>
      </div>
    </ng-template>
  </p-splitter>
</p-dialog>

<p-toast key="gestionar-matriculas" />
