<p-tabView [(activeIndex)]="activeTab">
  <p-toast />
  <p-tabPanel header="Historial de Apoderados" *ngIf="activeTab === 0" [disabled]="true">
    <div class="flex justify-content-end gap-2 mb-2">
      <p-button
        *ngIf="esDirector"
        size="small"
        icon="pi pi-plus"
        label="Nuevo"
        severity="success"
        (click)="nuevoApoderado()"
      />
      <p-button
        size="small"
        icon="pi pi-download"
        label="Exportar"
        severity="secondary"
        (click)="exportarApoderados()"
      />
    </div>
    <app-table-primeng
      [columnas]="columns"
      [data]="apoderados"
      [showCaption]="false"
      (accionBtnItem)="accionBtnItemTable($event)"
      [showPaginator]="true"
      [(selectedRowData)]="selectedItems"
      [actions]="actions"
    >
    </app-table-primeng>
  </p-tabPanel>
  <p-tabPanel header="Detalle de apoderado" *ngIf="activeTab === 1" [disabled]="true">
    <form [formGroup]="formApoderado">
      <div class="grid p-fluid">
        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Tipo de documento *</p-inputGroupAddon>
            <p-dropdown
              [options]="tipos_documentos"
              formControlName="iTipoIdentId"
              [filter]="true"
              styleClass="group-element"
              [appendTo]="'body'"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>
              <p-button label="Buscar" severity="success" (onClick)="searchPersona()" />
              Documento *
            </p-inputGroupAddon>
            <p-inputMask
              formControlName="cPersDocumento"
              [maxlength]="longitud_documento"
              [mask]="formato_documento"
              autoClear="false"
              slotChar=""
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Primer apellido *</p-inputGroupAddon>
            <input
              pInputText
              id="cPersPaterno"
              formControlName="cPersPaterno"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Segundo apellido *</p-inputGroupAddon>
            <input
              pInputText
              id="cPersMaterno"
              formControlName="cPersMaterno"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Nombres *</p-inputGroupAddon>
            <input
              pInputText
              id="cPersNombre"
              formControlName="cPersNombre"
              class="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Fecha de nacimiento *</p-inputGroupAddon>
            <p-calendar
              formControlName="dPersNacimiento"
              [iconDisplay]="'input'"
              [showIcon]="true"
              inputId="dPersNacimiento"
              [appendTo]="'body'"
              inputStyleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Género</p-inputGroupAddon>
            <p-dropdown
              [options]="sexos"
              formControlName="cPersSexo"
              [showClear]="true"
              [appendTo]="'body'"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Nacionalidad</p-inputGroupAddon>
            <p-dropdown
              [options]="nacionalidades"
              formControlName="iNacionId"
              [filter]="true"
              [showClear]="true"
              [appendTo]="'body'"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Relación</p-inputGroupAddon>
            <p-dropdown
              [options]="tipos_familiares"
              formControlName="iTipoFamiliarId"
              [filter]="true"
              [showClear]="true"
              [appendTo]="'body'"
              styleClass="group-element"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12 md:col-6">
          <p-inputGroup>
            <p-inputGroupAddon>Teléfono</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cPersTelefono"
              class="group-element"
              appendTo="body"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup>
            <p-inputGroupAddon>Correo</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cPersCorreo"
              class="group-element"
              appendTo="body"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
        <div class="col-12">
          <p-inputGroup class="vertical-group">
            <p-inputGroupAddon>Observaciones</p-inputGroupAddon>
            <input
              pInputText
              formControlName="cObservacion"
              aria-describedby="cObservacion-help"
              class="group-element"
              appendTo="body"
              [style]="{ flex: '1', width: '100%' }"
            />
          </p-inputGroup>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 justify-content-end">
        <p-button
          label="Ver todos"
          icon="pi pi-arrow-left"
          severity="secondary"
          (click)="verTodosApoderados()"
        />
        <p-button
          *ngIf="!iApoderadoId && !solo_ver"
          label="Registrar"
          icon="pi pi-save"
          severity="success"
          (click)="guardarApoderado()"
          [disabled]="formApoderado.invalid"
        />
        <p-button
          *ngIf="iApoderadoId && !solo_ver"
          label="Actualizar"
          icon="pi pi-save"
          severity="warning"
          (click)="actualizarApoderado()"
          [disabled]="formApoderado.invalid"
        />
      </div>
    </form>
  </p-tabPanel>
</p-tabView>
