<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column gap-2">
      <div class="m-0 text-2xl font-bold">Matrícula</div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons" class="flex flex-column flex-1">
    <div class="flex flex-wrap gap-2 justify-content-end">
      <button size="small" pButton severity="secondary" (click)="salir()">
        <i class="pi pi-arrow-left"></i>
        <span class="ml-2 hidden sm:block">Regresar</span>
      </button>
    </div>
  </ng-template>
  <ng-content>
    <form [formGroup]="formMatricula">
      <div class="grid p-fluid">
        <div class="col-12 md:col-4">
          <p-fieldset legend="Matrícula">
            <div class="grid p-fluid">
              <div class="col-12">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>
                    <p-button label="Buscar" (onClick)="searchEstudiante()" severity="success" />
                    Código *
                  </p-inputGroupAddon>
                  <p-inputMask
                    id="cEstCodigo"
                    formControlName="cEstCodigo"
                    aria-describedby="cEstCodigo-help"
                    mask="99999999999999"
                    autoClear="false"
                    slotChar=""
                    class="group-element"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Grado *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="nivel_grados"
                    formControlName="iNivelGradoId"
                    [filter]="true"
                    [appendTo]="'body'"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Sección *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="secciones"
                    formControlName="iSeccionId"
                    [checkmark]="true"
                    [filter]="true"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Turno *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="turnos"
                    formControlName="iTurnoId"
                    [filter]="true"
                    [appendTo]="'body'"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Fecha *</p-inputGroupAddon>
                  <p-calendar
                    formControlName="dtMatrFecha"
                    [iconDisplay]="'input'"
                    [showIcon]="true"
                    inputId="dtMatrFecha"
                    inputStyleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Tipo</p-inputGroupAddon>
                  <p-dropdown
                    [options]="tipos_matricula"
                    formControlName="iTipoMatrId"
                    [showClear]="true"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup>
                  <p-inputGroupAddon>Estado *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="estados_matricula"
                    formControlName="iMatrEstado"
                    styleClass="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup styleClass="vertical-group">
                  <p-inputGroupAddon>
                    <p-inputSwitch formControlName="iMatrNEE" />
                    <span>¿Tiene necesidades especiales? *</span>
                  </p-inputGroupAddon>
                </p-inputGroup>
              </div>
              <div class="col-12">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Observación</p-inputGroupAddon>
                  <input
                    pInputText
                    formControlName="cMatrObservaciones"
                    aria-describedby="cMatrObservaciones-help"
                    class="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
            </div>
          </p-fieldset>
        </div>
        <div class="col-12 md:col-8">
          <p-fieldset legend="Datos personales">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Tipo de documento *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="tipos_documentos"
                    formControlName="iTipoIdentId"
                    [filter]="true"
                    styleClass="group-element"
                    [appendTo]="'body'"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>
                    <p-button label="Buscar" severity="success" (onClick)="validarPersona()" />
                    Documento *
                  </p-inputGroupAddon>
                  <p-inputMask
                    formControlName="cPersDocumento"
                    [maxlength]="longitud_documento"
                    [mask]="formato_documento"
                    autoClear="false"
                    slotChar=""
                    styleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Primer apellido *</p-inputGroupAddon>
                  <input
                    pInputText
                    id="cPersPaterno"
                    formControlName="cPersPaterno"
                    class="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Segundo apellido *</p-inputGroupAddon>
                  <input
                    pInputText
                    id="cPersMaterno"
                    formControlName="cPersMaterno"
                    class="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Nombres *</p-inputGroupAddon>
                  <input
                    pInputText
                    id="cPersNombre"
                    formControlName="cPersNombre"
                    class="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="field col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Fecha de nacimiento *</p-inputGroupAddon>
                  <p-calendar
                    formControlName="dPersNacimiento"
                    [iconDisplay]="'input'"
                    [showIcon]="true"
                    inputId="dPersNacimiento"
                    [appendTo]="'body'"
                    inputStyleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup>
                  <p-inputGroupAddon>Género</p-inputGroupAddon>
                  <p-dropdown
                    [options]="sexos"
                    formControlName="cPersSexo"
                    [showClear]="true"
                    [appendTo]="'body'"
                    styleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup>
                  <p-inputGroupAddon>Nacionalidad</p-inputGroupAddon>
                  <p-dropdown
                    [options]="nacionalidades"
                    formControlName="iNacionId"
                    [filter]="true"
                    [showClear]="true"
                    [appendTo]="'body'"
                    styleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
            </div>
          </p-fieldset>
          <br />
          <p-fieldset legend="Apoderado" *ngIf="!iMatrId">
            <div class="grid p-fluid">
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Tipo de documento *</p-inputGroupAddon>
                  <p-dropdown
                    [options]="tipos_documentos"
                    formControlName="iTipoIdentIdApoderado"
                    styleClass="group-element"
                    [appendTo]="'body'"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>
                    <p-button label="Buscar" severity="success" (onClick)="validarPersona()" />
                    Documento *
                  </p-inputGroupAddon>
                  <p-inputMask
                    formControlName="cPersDocumentoApoderado"
                    [maxlength]="longitud_documento"
                    [mask]="formato_documento"
                    autoClear="false"
                    slotChar=""
                    styleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Apellidos y nombres</p-inputGroupAddon>
                  <input
                    pInputText
                    formControlName="cApoderadoApenom"
                    class="group-element"
                    appendTo="body"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-6">
                <p-inputGroup class="vertical-group">
                  <p-inputGroupAddon>Relación</p-inputGroupAddon>
                  <p-dropdown
                    [options]="tipos_familiares"
                    formControlName="iTipoFamiliarId"
                    [filter]="true"
                    [showClear]="true"
                    [appendTo]="'body'"
                    styleClass="group-element"
                    [style]="{ flex: '1', width: '100%' }"
                  />
                </p-inputGroup>
              </div>
              <div class="col-12 md:col-4"></div>
            </div>
          </p-fieldset>
        </div>
      </div>
    </form>
    <div class="flex flex-wrap gap-2 justify-content-end" *ngIf="!solo_ver">
      <p-button
        *ngIf="!iMatrId"
        label="Guardar"
        severity="success"
        icon="pi pi-save"
        [disabled]="formMatricula.invalid"
        (onClick)="guardarMatricula()"
      />
      <p-button
        *ngIf="iMatrId"
        label="Actualizar"
        severity="success"
        [disabled]="formMatricula.invalid"
        (onClick)="actualizarMatricula()"
      />
    </div>
  </ng-content>
</p-panel>

<p-toast></p-toast>
