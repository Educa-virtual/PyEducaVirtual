<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Reporte de indicadores</div>
    </div>
  </ng-template>

  <form [formGroup]="formIndicadores" class="grid">
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Nivel</p-inputGroupAddon>
        <p-dropdown
          [options]="nivel_tipos"
          [showClear]="esAdminDremo"
          formControlName="iNivelTipoId"
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          appendTo="body"
          (onChange)="filterIes()"
          (onClear)="filterIes()"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-6">
      <p-inputGroup>
        <p-inputGroupAddon>IE</p-inputGroupAddon>
        <p-dropdown
          [options]="instituciones_educativas"
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          [filter]="esAdminDremo"
          [showClear]="esAdminDremo"
          formControlName="iIieeId"
          (onChange)="filterSede()"
          (onClear)="filterSede()"
        >
        </p-dropdown>
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Sede</p-inputGroupAddon>
        <p-dropdown
          appendTo="body"
          [options]="sedes"
          formControlName="iSedeId"
          [showClear]="esAdminDremo"
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          (onChange)="filterGrados()"
          (onClear)="filterGrados()"
        >
        </p-dropdown>
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Grado</p-inputGroupAddon>
        <p-dropdown
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          [showClear]="true"
          [options]="nivel_grados_filtrados"
          formControlName="iNivelGradoId"
          (onChange)="filterSecciones()"
          (onClear)="filterSecciones()"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Sección</p-inputGroupAddon>
        <p-dropdown
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          [showClear]="true"
          [options]="secciones_filtradas"
          formControlName="iSeccionId"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3">
      <p-inputGroup>
        <p-inputGroupAddon>Género</p-inputGroupAddon>
        <p-dropdown
          styleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          [showClear]="true"
          [options]="sexos"
          formControlName="cSexo"
        />
      </p-inputGroup>
    </div>
    <div class="col-12 lg:col-3 flex justify-content-end gap-2">
      <p-button
        pRipple
        severity="primary"
        label="Buscar"
        icon="pi pi-search"
        (onClick)="obtenerResultadosxIndicador()"
      />
      <p-button
        pRipple
        severity="success"
        label="Exportar"
        icon="pi pi-fw pi-print"
        [disabled]="data().length === 0"
        (click)="generarExcel()"
      />
    </div>
    <app-tabs-primeng
      class="col-12"
      [activeIndex]="selectTab()"
      [tabs]="tabs()"
      [getIndex]="false"
      (updateTab)="updateTab($event)"
    >
    </app-tabs-primeng>
    @if (data().length) {
      @for (reporte of reportes(); track reporte.key) {
        @if (tabSeleccionado() === reporte.key) {
          <div class="col-12">
            <div class="tag2" [style.backgroundColor]="reporte.color">
              {{ reporte.titulo }}
            </div>

            <div class="grid relative my-3">
              <div class="tag">(Total de estudiantes: {{ _total }})</div>
              @if (showGrafica()) {
                <div class="col-12 lg:col-6 mt-4">
                  <p-chart
                    type="pie"
                    [data]="chartDataPie()"
                    [options]="chartOptionsPie()"
                    [plugins]="piePlugin"
                    height="300px"
                    class="pie-90"
                  />
                </div>
                <div class="col-12 lg:col-6 mt-4">
                  <p-chart
                    type="bar"
                    [data]="chartDataBar()"
                    [options]="chartOptionsBar()"
                    height="300px"
                  />
                </div>
              }

              <div class="col-12 mt-4">
                <app-table-primeng
                  [columnas]="columnasTabla()"
                  [showCaption]="false"
                  [data]="data()"
                  [showPaginator]="true"
                  [showSortIcon]="true"
                  [actions]="[]"
                />
              </div>
            </div>
          </div>
        }
      }
    } @else {
      <div class="col-12">
        <app-no-data [showIcon]="'NO-DATA'" mensaje="No se encontraron resultados" />
      </div>
    }
  </form>
</p-panel>

<p-toast></p-toast>
