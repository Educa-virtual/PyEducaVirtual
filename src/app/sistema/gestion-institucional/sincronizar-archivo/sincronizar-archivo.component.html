<p-panel>
  <ng-template pTemplate="header">
    <div class="flex align-items-center gap-2">
      <span class="font-bold white-space-nowrap text-2xl m-0">
        Sincronizar archivos y descarga de plantillas
      </span>
    </div>
  </ng-template>
  <p-tabView styleClass="tabview-custom">
    <p-tabPanel>
      <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2">
          <span class="font-bold white-space-nowrap m-0"> Importar </span>
        </div>
      </ng-template>
      <ng-template pTemplate="content">
        <app-bulk-data-import></app-bulk-data-import>
      </ng-template>
    </p-tabPanel>
    <p-tabPanel header="Header II">
      <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2">
          <span class="font-bold white-space-nowrap m-0"> Exportar </span>
        </div>
      </ng-template>
      <form [formGroup]="form">
        <div class="grid p-fluid mt-2">
          <div class="col-12 md:col-9">
            <p-inputGroup>
              <p-inputGroupAddon>Seleccionar tabla a exportar</p-inputGroupAddon>
              <p-dropdown
                [options]="reg_modulos"
                [filter]="true"
                filterBy="modulo"
                optionLabel="modulo"
                optionValue="id"
                formControlName="iTabla"
                styleClass="group-element"
                [style]="{ flex: 1, width: '100%' }"
              />
            </p-inputGroup>
          </div>
          <div class="col-12 md:col-3">
            <p-button
              label="Exportar registros"
              icon="pi pi-list"
              (click)="selectTabla()"
              severity="primary"
            />
          </div>
          <div class="col-12 md:col-6"></div>
        </div>
      </form>
    </p-tabPanel>
  </p-tabView>
</p-panel>
