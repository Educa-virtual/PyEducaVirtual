<p-breadcrumb class="max-w-full" [model]="breadCrumbItems" [home]="breadCrumbHome" />
<p-toast />

<p-panel>
  <ng-template pTemplate="header">
    <div class="flex flex-column">
      <div class="flex text-2xl font-bold">Años académicos</div>
    </div>
  </ng-template>
  <ng-template pTemplate="icons">
    <div class="flex flex-wrap gap-2 justify-content-end">
      <p-button
        size="small"
        severity="success"
        pTooltip="Aperturar nueva año"
        tooltipPosition="left"
        (click)="agregarYear()"
      >
        <i class="pi pi-fw pi-plus"></i>
        <span class="ml-2 hidden sm:block">Aperturar</span>
      </p-button>
    </div>
  </ng-template>
  <app-table-primeng
    [columnas]="columns"
    [showCaption]="true"
    [data]="years"
    (accionBtnItem)="accionBtnItem($event)"
    [showPaginator]="true"
    [actions]="actions"
  />
</p-panel>

<p-dialog
  [header]="dialogYear.title"
  [(visible)]="dialogYear.visible"
  [style]="{ width: '56rem' }"
  [modal]="true"
>
  <form class="grid mt-2" [formGroup]="formYear">
    <div class="col-12">
      <p-inputGroup>
        <p-inputGroupAddon>Nombre *</p-inputGroupAddon>
        <p-inputNumber
          inputStyleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          appendTo="body"
          formControlName="iYearId"
          min="2000"
          max="2100"
          [useGrouping]="false"
          [showButtons]="true"
          placeholder="Ingrese el año académico"
        />
      </p-inputGroup>
    </div>
    <div class="col-12">
      <p-inputGroup class="vertical-group">
        <p-inputGroupAddon>Nombre oficial *</p-inputGroupAddon>
        <input
          type="text"
          pInputText
          inputStyleClass="group-element"
          [style]="{ flex: '1', width: '100%' }"
          appendTo="body"
          formControlName="cYearOficial"
          placeholder="Ingrese el nombre oficial"
        />
      </p-inputGroup>
    </div>
  </form>

  <div class="flex justify-content-end gap-2" *ngIf="formYear.enabled">
    <p-button label="Cancelar" severity="secondary" (onClick)="dialogYear.visible = false" />
    <p-button label="Guardar" severity="primary" (onClick)="guardarYear()" />
    <p-button *ngIf="bEditar" label="Actualizar" severity="warning" (onClick)="actualizarYear()" />
  </div>
</p-dialog>

<p-dialog
  #dialogSemanasLectivas
  [header]="dialogs.distribucionBloques.title"
  [(visible)]="dialogs.distribucionBloques.visible"
  [style]="{ width: '56rem' }"
  [modal]="true"
  (onShow)="dialogSemanasLectivas.maximize()"
>
  <div class="grid mt-2">
    <div class="col-12">
      <p-button
        styleClass="w-full"
        icon="pi pi-plus"
        label="Agregar bloque"
        [disabled]="formYear.disabled"
        severity="primary"
        (onClick)="
          distribucionBloques.accionBtnItem({
            accion: 'agregar',
            item: undefined,
          })
        "
      />
    </div>

    <div class="col-12">
      <app-table-primeng
        (accionBtnItem)="distribucionBloques.accionBtnItem($event)"
        [actions]="distribucionBloques.table.actions"
        [columnas]="distribucionBloques.table.columns"
        [data]="distribucionBloques.table.data"
      >
      </app-table-primeng>
    </div>
  </div>
</p-dialog>

<p-dialog
  [header]="dialogs.distribucionBloque.title"
  [(visible)]="dialogs.distribucionBloque.visible"
  [style]="{ width: '56rem' }"
  [modal]="true"
>
  <form class="grid mt-2" [formGroup]="forms.distribucionBloque">
    <div class="col-12 grid">
      <div class="col-10 flex flex-column gap-2">
        <label for="iTipoDistribucionId">Tipo de distribución de bloque</label>
        <p-dropdown
          formControlName="iTipoDistribucionId"
          optionLabel="name"
          styleClass="w-full"
          placeholder="Seleccione un tipo de distribución de bloque"
          optionValue="code"
          [options]="distribucionBloques.types"
          optionLabel="name"
        />
      </div>

      <div class="col flex flex-column gap-2">
        <label for="iEstado">Estado</label>
        <p-toggleButton
          formControlName="iEstado"
          styleClass="w-full"
          onLabel="Activo"
          offLabel="Inactivo"
        />
      </div>
    </div>
    <div class="col-12 grid">
      <div class="col-6 flex flex-column gap-2">
        <label for="dtInicioBloque">Inicio del bloque</label>
        <p-calendar
          appendTo="body"
          [showOnFocus]="false"
          inputStyleClass="w-full"
          styleClass="w-full"
          formControlName="dtInicioBloque"
          [iconDisplay]="'input'"
          [showIcon]="true"
          inputId="dtInicioBloque"
        />
      </div>
      <div class="col-6 flex flex-column gap-2">
        <label for="dtFinBloque">Fin del bloque</label>
        <p-calendar
          appendTo="body"
          [showOnFocus]="false"
          inputStyleClass="w-full"
          styleClass="w-full"
          formControlName="dtFinBloque"
          [iconDisplay]="'input'"
          [showIcon]="true"
          inputId="dtFinBloque"
        />
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    @if (this.forms.distribucionBloque.enabled) {
      <div class="flex justify-content-between gap-2">
        <p-button
          label="Cancelar"
          [text]="true"
          severity="secondary"
          (onClick)="dialogs.distribucionBloque.visible = false"
        />
        <p-button
          label="Guardar"
          [outlined]="true"
          severity="secondary"
          (onClick)="distribucionBloques.saveData()"
        />
      </div>
    }
  </ng-template>
</p-dialog>

<p-dialog
  [header]="dialogs.procesarPeriodo.title"
  [(visible)]="dialogs.procesarPeriodo.visible"
  [style]="{ width: '56rem' }"
  [modal]="true"
>
  <form [formGroup]="forms.procesarPeriodos" class="grid mt-2">
    <div class="col-12 flex flex-column gap-2">
      <label for="iTipoDistribucionId">Tipo de periodo de evaluación</label>
      <p-dropdown
        formControlName="iPeriodoEvalId"
        optionLabel="name"
        appendTo="body"
        styleClass="w-full"
        placeholder="Seleccione un tipo de distribución de bloque"
        optionValue="code"
        [options]="periodoEvaluaciones.types"
        optionLabel="name"
      />
    </div>
  </form>

  <ng-template pTemplate="footer">
    @if (this.forms.procesarPeriodos.enabled) {
      <div class="flex justify-content-between gap-2">
        <p-button
          label="Cancelar"
          [text]="true"
          severity="secondary"
          (onClick)="dialogs.procesarPeriodo.visible = false"
        />
        <p-button
          label="Iniciar"
          [outlined]="true"
          severity="secondary"
          (onClick)="periodoEvaluaciones.processData()"
        />
      </div>
    }
  </ng-template>
</p-dialog>
